<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homeschool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F6F5C'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --bg:#FBFAF5; --paper:#FFFFFF; --ink:#22302B; --ink-2:#5B6A64; --ink-3:#8E9A95;
  --line:#DCE3DE; --line-2:#EDF1EE; --accent:#1F6F5C; --accent-ink:#FFFFFF; --accent-soft:#E3F0EA;
  --done:#3E8E5E; --bring:#B5541C; --bring-soft:#F9E9DD; --today:#FFF6DC; --danger:#B23A3A;
  --shadow:0 8px 24px rgba(34,48,43,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161B19; --paper:#1F2623; --ink:#EAF0EC; --ink-2:#A8B4AE; --ink-3:#77837D;
    --line:#33403A; --line-2:#2A342F; --accent:#5FBFA2; --accent-ink:#0F1A16; --accent-soft:#213B33;
    --done:#6CC48C; --bring:#E5905A; --bring-soft:#3C2A1E; --today:#3A3420; --danger:#E27C7C;
    --shadow:0 8px 24px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4;padding-block:0 60px;padding-inline:16px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;padding-block:18px 12px;border-bottom:2px solid var(--ink)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:32px;line-height:1.05;margin:0;letter-spacing:-.01em;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h1 .wk select{font-family:inherit;font-size:inherit;font-weight:inherit;background:transparent;border:0;border-bottom:2px dashed var(--line);padding:0 2px;color:var(--ink);cursor:pointer;max-width:50vw}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:13px}
.kids{display:flex;gap:6px;flex-wrap:wrap;padding-block:12px 0}
.me{font-size:13px;color:var(--ink-3)}

/* summary */
.summary{display:grid;grid-template-columns:minmax(220px,1.2fr) repeat(var(--nd,4),minmax(110px,1fr));gap:12px;padding-block:14px;align-items:stretch}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.stat .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-family:"Source Sans 3",sans-serif;font-size:14px;color:var(--ink-2);font-weight:400}
.bar{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.stat.day{cursor:pointer}
.stat.day[data-active="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat.day .left{font-size:13px;color:var(--ink-2)}
.daytabs{display:none;gap:6px;padding-block:8px;overflow-x:auto}
.daytabs .chip{white-space:nowrap}

/* grid */
.grid{display:grid;grid-template-columns:150px repeat(var(--nd,4),minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.gh{background:var(--accent-soft);color:var(--ink);font-weight:700;padding:10px 12px;font-size:14px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.subj{padding:12px;border-top:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.subj b{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:16px;line-height:1.15}
.subj span{font-size:12px;color:var(--ink-3)}
.subj .pct{font-size:12px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums}
.subj .tools{display:flex;gap:4px;margin-top:6px}
.cell{padding:8px 10px;border-top:1px solid var(--line);border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.cell:last-child{border-right:0}
.task{display:flex;gap:8px;align-items:flex-start;border-radius:6px;padding:4px 4px;min-width:0}
.task:hover{background:var(--line-2)}
.task input[type=checkbox]{margin:3px 0 0;width:18px;height:18px;accent-color:var(--done);flex:none;cursor:pointer}
.task .t{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;line-height:1.3;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.task.done .t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.task .t .meta{display:block;font-size:12px;color:var(--ink-3);text-decoration:none;margin-top:1px}
.task.bring .t::before{content:"BRING";display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;background:var(--bring-soft);color:var(--bring);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.task .cc{flex:none;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:1px 6px;margin-top:4px}
.add{align-self:flex-start;border:1px dashed var(--line);background:transparent;color:var(--ink-3);border-radius:6px;padding:2px 8px;font-size:13px;margin-top:2px}
.add:hover{color:var(--accent);border-color:var(--accent)}
.empty{color:var(--ink-3);font-size:13px;font-style:italic;padding:4px}
.bringlist{margin-top:18px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--bring);border-radius:10px;padding:12px 16px}
.bringlist h2{margin:0 0 6px;font-family:Fraunces,Georgia,serif;font-size:18px;font-weight:600}
.bringlist p{margin:0 0 8px;color:var(--ink-2);font-size:14px}
.bringlist ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.blank{padding:28px 20px;text-align:center;color:var(--ink-2);background:var(--paper);border:1px dashed var(--line);border-radius:12px;margin-top:14px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* overview */
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding-block:14px}
.ov .card{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--c,var(--accent));border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.ov .card b{font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:600}
.ov .card .g{font-size:13px;color:var(--ink-3)}

/* login */
.login{max-width:380px;margin:60px auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.login h1{font-size:26px}
.login .people{display:flex;flex-wrap:wrap;gap:6px}
.login input{border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font-size:20px;letter-spacing:.2em;text-align:center;width:100%}
.err{color:var(--danger);font-size:14px;min-height:1.2em}

/* drawer / modals */
.drawer{position:fixed;inset:0;background:rgba(20,30,26,.45);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.drawer[open]{display:flex}
.panel{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);width:min(600px,100%);padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.panel h3{margin:0;font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:600}
.panel label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:600}
.panel textarea,.panel input,.panel select{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);font-weight:400;font-size:15px;width:100%}
.panel textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.split{justify-content:space-between}
.status{font-size:13px;color:var(--ink-3)}
.thread{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.thread h4{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.msg{background:var(--bg);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.msg.mine{background:var(--accent-soft)}
.msg .who{font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.msg .who b{color:var(--ink-2)}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-height:44px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tablewrap{overflow-x:auto}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

@media (max-width:820px){
  h1{font-size:26px}
  .summary{grid-template-columns:1fr}
  .summary .stat.day{display:none}
  .daytabs{display:flex}
  .grid{grid-template-columns:1fr}
  .gh{display:none}
  .subj{border-right:0;flex-direction:row;align-items:baseline;gap:8px;padding:10px 12px;flex-wrap:wrap}
  .subj .pct{margin:0 0 0 auto}
  .cell{display:none;border-right:0}
  .cell[data-show="true"]{display:flex}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<!-- assignment drawer -->
<div class="drawer" id="drawer">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="row split"><h3 id="dTitle">Assignment</h3><button class="btn quiet" id="dClose">Close</button></div>
    <div id="dEdit">
      <label>Assignment <input id="dText"></label>
      <div class="row" style="margin-top:8px">
        <label style="flex:1">Subject <select id="dSubj"></select></label>
        <label style="flex:1">Day <select id="dDay"></select></label>
        <label style="flex:1">Type <select id="dKind"><option value="task">To do</option><option value="bring">Bring to community</option></select></label>
      </div>
    </div>
    <div id="dRead" style="font-size:17px;line-height:1.35"></div>
    <div class="status" id="dStatus"></div>
    <div class="row split">
      <button class="btn danger sm" id="dDelete">Delete</button>
      <div class="row"><button class="btn" id="dToggle">Mark done</button><button class="btn primary" id="dSave">Save</button></div>
    </div>
    <div class="thread">
      <h4>Notes &amp; questions</h4>
      <div id="dThread" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="compose"><textarea id="dMsg" placeholder="Leave a note — a question, where you got stuck, feedback…"></textarea><button class="btn primary" id="dSend">Post</button></div>
    </div>
  </div>
</div>

<!-- family settings -->
<div class="drawer" id="fam">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <div class="row split"><h3 id="fTitle">Family</h3><button class="btn quiet" id="fClose">Close</button></div>
    <div class="tabs"><button id="fTabKids" aria-selected="true">Children</button><button id="fTabLogins" aria-selected="false">Logins</button></div>
    <div id="fKids">
      <div class="tablewrap"><table><thead><tr><th>Child</th><th>Grade / program</th><th>Color</th><th></th></tr></thead><tbody id="fKidRows"></tbody></table></div>
      <form id="fKidForm" class="row" style="margin-top:10px">
        <input id="fKidName" placeholder="Child's name" required style="flex:2;min-width:120px">
        <input id="fKidGrade" placeholder="Grade / program" style="flex:2;min-width:120px">
        <input id="fKidColor" type="color" value="#1F6F5C" style="width:48px;padding:2px;height:38px">
        <button class="btn primary">Add child</button>
      </form>
    </div>
    <div id="fLogins" hidden>
      <p class="status" style="margin:0 0 8px">Each person signs in with their name and a PIN. A child's login only sees their own page; parents see everyone.</p>
      <div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>For child</th><th></th></tr></thead><tbody id="fUserRows"></tbody></table></div>
      <form id="fUserForm" class="row" style="margin-top:10px">
        <input id="fUserName" placeholder="Name" required style="flex:2;min-width:100px">
        <select id="fUserRole" style="flex:1"><option value="parent">Parent</option><option value="student">Child</option></select>
        <select id="fUserStudent" style="flex:1"></select>
        <input id="fUserPin" placeholder="PIN (4+)" required minlength="4" style="flex:1;min-width:90px">
        <button class="btn primary">Add login</button>
      </form>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const el = (tag, attrs={}, ...kids) => { const n=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==='class') n.className=v; else if(k==='style'&&typeof v==='object') Object.assign(n.style,v); else if(k.startsWith('on')) n.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) n.setAttribute(k,v);} for(const k of kids){ if(k==null||k===false) continue; n.append(k.nodeType?k:document.createTextNode(k)); } return n; };
  const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2000); };
  const fmt = iso => { if(!iso) return ''; try{ const d=new Date(iso.endsWith('Z')||iso.includes('+')?iso:iso.replace(' ','T')+'Z'); return d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }catch{ return ''; } };
  const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch{return d;} }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} } };
  async function api(path, method='GET', body){
    const r = await fetch('/api'+path, { method, headers: body?{'content-type':'application/json'}:{}, body: body?JSON.stringify(body):undefined, credentials:'same-origin' });
    const data = await r.json().catch(()=>({}));
    if(r.status===401 && path!=='/login'){ state.user=null; render(); throw new Error('Signed out'); }
    if(!r.ok){ throw new Error(data.error || ('Request failed ('+r.status+')')); }
    return data;
  }

  const state = { loaded:false, user:null, users:[], students:[], familyName:'Homeschool', student:null, weeks:[], week:null, overview:null,
    editMode:false, activeDay: ls.get('day',0), editingId:null, view:'board' };
  const isParent = () => state.user && state.user.role==='parent';
  const pct = list => list.length ? Math.round(100*list.filter(t=>t.done).length/list.length) : null;

  // ---------- boot ----------
  async function boot(){
    try{ const me = await api('/me'); Object.assign(state, {user:me.user, users:me.users, students:me.students, familyName:me.familyName, loaded:true}); }
    catch(e){ state.loaded=true; toast(e.message); }
    document.title = state.familyName;
    if(state.user){ await pickStudent(ls.get('student', null)); }
    render();
  }
  async function pickStudent(id){
    let s = state.students.find(x=>x.id===Number(id)) || state.students[0] || null;
    state.student = s; state.week=null; state.weeks=[];
    if(s){ ls.set('student', s.id); await loadWeeks(ls.get('week-'+s.id, null)); }
  }
  async function loadWeeks(preferId){
    state.weeks = await api('/students/'+state.student.id+'/weeks');
    const pick = state.weeks.find(w=>w.id===Number(preferId)) || state.weeks[0];
    if(pick) await loadWeek(pick.id); else state.week=null;
  }
  async function loadWeek(id){
    state.week = await api('/weeks/'+id); ls.set('week-'+state.student.id, id);
    if(state.activeDay>=state.week.days.length) state.activeDay=0;
    render();
  }
  async function refresh(){ // silent re-poll
    if(!state.user || !state.week || document.hidden || $('#drawer').hasAttribute('open')) return;
    try{ const w = await api('/weeks/'+state.week.id); if(JSON.stringify(w)!==JSON.stringify(state.week)){ state.week=w; render(); } }catch{}
  }
  setInterval(refresh, 15000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refresh(); });

  // ---------- render ----------
  function render(){
    const app=$('#app'); app.innerHTML='';
    if(!state.loaded){ app.append(el('p',{class:'status',style:'padding:40px;text-align:center'},'Loading…')); return; }
    if(!state.user) return renderLogin(app);
    renderHeader(app);
    if(!state.student){ app.append(el('div',{class:'blank'}, el('div',{}, isParent()?'No children set up yet.':'Your page isn\'t set up yet — ask a parent.'), isParent()? el('button',{class:'btn primary',onclick:()=>openFamily('kids')},'Add your first child'):null)); return; }
    if(state.view==='overview' && isParent()) return renderOverview(app);
    if(!state.week){ app.append(el('div',{class:'blank'}, el('div',{}, `No weeks yet for ${state.student.name}.`), isParent()? el('button',{class:'btn primary',onclick:newWeek},'+ Create Week 1'):null)); return; }
    renderSummary(app); renderGrid(app);
  }

  function renderLogin(app){
    const box=el('div',{class:'login'});
    box.append(el('div',{class:'eyebrow'},state.familyName), el('h1',{},'Who are you?'));
    const people=el('div',{class:'people'}); let sel = ls.get('lastUser', null);
    if(!state.users.some(u=>u.id===sel)) sel = state.users[0] && state.users[0].id;
    const draw=()=>{ people.innerHTML=''; state.users.forEach(u=>people.append(el('button',{class:'chip',type:'button','aria-pressed':String(u.id===sel),onclick:()=>{sel=u.id;draw();pin.focus();}},u.name))); };
    const pin=el('input',{type:'password',inputmode:'numeric',autocomplete:'current-password',placeholder:'PIN','aria-label':'PIN'});
    const err=el('div',{class:'err'});
    const form=el('form',{onsubmit:async e=>{ e.preventDefault(); err.textContent=''; try{ await api('/login','POST',{user_id:sel,pin:pin.value}); ls.set('lastUser',sel); state.loaded=false; render(); await boot(); }catch(x){ err.textContent=x.message; pin.value=''; pin.focus(); } }},
      people, el('label',{class:'eyebrow',style:'margin-top:6px'},'PIN'), pin, err, el('button',{class:'btn primary',style:'padding:10px'},'Sign in'));
    draw(); box.append(form); app.append(box); setTimeout(()=>pin.focus(),50);
  }

  function renderHeader(app){
    const h=el('header');
    const brand=el('div',{class:'brand'}, el('div',{class:'eyebrow'}, state.familyName));
    const h1=el('h1');
    if(state.student && state.view==='board'){
      h1.append(el('span',{},state.student.name));
      if(state.weeks.length){ const s=el('select',{'aria-label':'Week',onchange:e=>loadWeek(Number(e.target.value))}); state.weeks.forEach(w=>s.append(el('option',{value:w.id,selected:state.week&&w.id===state.week.id},`${w.title}${w.total?` · ${w.done}/${w.total}`:''}`))); h1.append(el('span',{class:'wk'},'· ',s)); }
    } else h1.append(state.view==='overview'?'This week, everyone':state.familyName);
    brand.append(h1); h.append(brand);
    const c=el('div',{class:'controls'});
    c.append(el('span',{class:'me'},`Signed in as ${state.user.name}`));
    if(isParent()){
      c.append(el('button',{class:'btn quiet',onclick:()=>{state.view=state.view==='overview'?'board':'overview'; render(); if(state.view==='overview') loadOverview();}}, state.view==='overview'?'Back to board':'Everyone'));
      if(state.student && state.week && state.view==='board') c.append(el('button',{class:'btn quiet',id:'editToggle','aria-pressed':String(state.editMode),onclick:()=>{state.editMode=!state.editMode;render();}}, state.editMode?'Done editing':'Edit'));
      if(state.student && state.view==='board') c.append(el('button',{class:'btn',onclick:newWeek},'+ New week'));
      c.append(el('button',{class:'btn',onclick:()=>openFamily('kids')},'Family'));
    }
    c.append(el('button',{class:'btn quiet',onclick:async()=>{ await api('/logout','POST',{}); state.user=null; state.student=null; state.week=null; render(); }},'Sign out'));
    h.append(c); app.append(h);
    if(isParent() && state.students.length>1 && state.view==='board'){
      const k=el('div',{class:'kids'});
      state.students.forEach(s=>k.append(el('button',{class:'chip','aria-pressed':String(state.student&&s.id===state.student.id),style:{'--c':s.color},onclick:async()=>{ await pickStudent(s.id); render(); }}, el('span',{class:'dot'}), s.name)));
      app.append(k);
    }
  }

  async function loadOverview(){ try{ state.overview = await api('/overview'); }catch(e){ toast(e.message); } render(); }
  function renderOverview(app){
    const g=el('div',{class:'ov'});
    (state.overview||[]).forEach(o=>{
      const p = o.total? Math.round(100*o.done/o.total) : null;
      g.append(el('button',{class:'card',style:{'--c':o.color},onclick:async()=>{ state.view='board'; await pickStudent(o.student_id); if(o.week_id) await loadWeek(o.week_id); render(); }},
        el('b',{},o.name), el('span',{class:'g'}, o.grade||''),
        el('div',{class:'v',style:'font-family:Fraunces,Georgia,serif;font-size:24px'}, o.week_id ? `${o.done}/${o.total}` : '—', el('small',{style:'font-size:13px;color:var(--ink-2);font-family:inherit'}, o.week_id? `  ${o.title}` : '  no weeks yet')),
        el('div',{class:'bar'}, el('i',{style:`width:${p??0}%`})),
        el('span',{class:'g'}, o.week_id ? (o.total-o.done ? `${o.total-o.done} left` : 'all done ✓') : '')));
    });
    if(!state.overview) g.append(el('p',{class:'status'},'Loading…'));
    app.append(g);
  }

  function renderSummary(app){
    const w=state.week, all=w.tasks, done=all.filter(t=>t.done).length, p=pct(all)??0;
    const left=all.filter(t=>!t.done&&t.kind!=='bring').length, bring=all.filter(t=>t.kind==='bring'&&!t.done).length;
    const s=el('section',{class:'summary',style:{'--nd':w.days.length}});
    s.append(el('div',{class:'stat'}, el('div',{class:'k'},'Week progress'), el('div',{class:'v'}, `${done} `, el('small',{},`of ${all.length} done · ${left} to do${bring?` · ${bring} to pack`:''}`)), el('div',{class:'bar'}, el('i',{style:`width:${p}%`}))));
    w.days.forEach((d,i)=>{
      const list=all.filter(t=>t.day===i), dp=pct(list); const l=list.filter(t=>!t.done).length;
      s.append(el('button',{class:'stat day','data-active':String(state.activeDay===i), onclick:()=>{state.activeDay=i; ls.set('day',i); render();}},
        el('div',{class:'k'},d), el('div',{class:'v'}, dp==null?'—':`${dp}%`), el('div',{class:'left'}, list.length? (l? `${l} left`:'all done ✓') : 'nothing scheduled'), el('div',{class:'bar'}, el('i',{style:`width:${dp??0}%`}))));
    });
    app.append(s);
    const dt=el('div',{class:'daytabs'});
    w.days.forEach((d,i)=>{ const l=all.filter(t=>t.day===i&&!t.done).length; dt.append(el('button',{class:'chip','aria-pressed':String(state.activeDay===i),onclick:()=>{state.activeDay=i; ls.set('day',i); render();}}, `${d}${l?` · ${l}`:' ✓'}`)); });
    app.append(dt);
  }

  function taskRow(t, showDay){
    const row=el('div',{class:`task${t.done?' done':''}${t.kind==='bring'?' bring':''}`});
    const cb=el('input',{type:'checkbox',id:'cb-'+t.id,'aria-label':t.text, onchange:()=>toggleDone(t, cb.checked)}); cb.checked=!!t.done;
    const meta = t.done && t.done_by ? `${t.done_by} · ${fmt(t.done_at)}` : (showDay ? state.week.days[t.day] : '');
    const b=el('button',{class:'t',onclick:()=>openDrawer(t.id)}, t.text, meta? el('span',{class:'meta'},meta):null);
    row.append(cb,b); if(t.comments.length) row.append(el('span',{class:'cc',title:`${t.comments.length} note(s)`},String(t.comments.length)));
    return row;
  }
  function renderGrid(app){
    const w=state.week, g=el('section',{class:'grid',style:{'--nd':w.days.length}});
    g.append(el('div',{class:'gh'},'Subject')); w.days.forEach(d=>g.append(el('div',{class:'gh'},d)));
    const subjects = w.subjects.slice(); const orphan = w.tasks.filter(t=>!subjects.some(s=>s.id===t.subject_id));
    if(orphan.length) subjects.push({id:'', name:'Other', sub:''});
    subjects.forEach(s=>{
      const mine=w.tasks.filter(t=>(t.subject_id===s.id)||(s.id===''&&!w.subjects.some(x=>x.id===t.subject_id)));
      const sj=el('div',{class:'subj'}, el('b',{},s.name), s.sub? el('span',{},s.sub):null, el('span',{class:'pct'}, mine.length?`${mine.filter(t=>t.done).length}/${mine.length}`:''));
      if(state.editMode && s.id!=='') sj.append(el('div',{class:'tools'}, el('button',{class:'btn quiet sm',onclick:()=>renameSubject(s)},'rename'), el('button',{class:'btn quiet sm',onclick:()=>removeSubject(s)},'remove')));
      g.append(sj);
      w.days.forEach((d,i)=>{
        const c=el('div',{class:'cell','data-show':String(state.activeDay===i)});
        const list=mine.filter(t=>t.day===i); list.forEach(t=>c.append(taskRow(t,false)));
        if(state.editMode) c.append(el('button',{class:'add',onclick:()=>addTasks(s.id,i)},'+ add'));
        else if(!list.length) c.append(el('div',{class:'empty'},'—'));
        g.append(c);
      });
    });
    if(state.editMode) g.append(el('div',{class:'subj',style:'grid-column:1/-1;flex-direction:row;gap:8px;flex-wrap:wrap'}, el('button',{class:'add',onclick:addSubject},'+ add subject'), el('button',{class:'add',onclick:renameDays},'rename days'), el('button',{class:'add',onclick:deleteWeek},'delete this week')));
    if(!w.subjects.length && !state.editMode) g.append(el('div',{class:'empty',style:'grid-column:1/-1;padding:16px'}, isParent()? 'No subjects yet — press Edit to add subjects and assignments.' : 'Nothing here yet.'));
    app.append(g);
    const bring=w.tasks.filter(t=>t.kind==='bring');
    if(bring.length){ const bl=el('section',{class:'bringlist'}, el('h2',{},'Pack for Community Day'), el('p',{},'Everything flagged "bring" this week, in one place.')); const ul=el('ul'); bring.forEach(t=>ul.append(el('li',{},taskRow(t,true)))); bl.append(ul); app.append(bl); }
  }

  // ---------- actions ----------
  const uid = () => Math.random().toString(36).slice(2,8);
  async function saveWeekMeta(patch, msg){ try{ state.week = await api('/weeks/'+state.week.id,'PUT',patch); render(); if(msg) toast(msg); }catch(e){ toast(e.message); } }
  async function toggleDone(t, done){
    t.done=done; t.done_by=done?state.user.name:null; t.done_at=done?new Date().toISOString():null; render();
    try{ await api('/tasks/'+t.id+'/done','POST',{done}); }catch(e){ toast(e.message); refresh(); }
  }
  async function addTasks(subjectId, day){
    const v=prompt('New assignment (one per line for several):'); if(!v) return;
    const lines=v.split('\n').map(x=>x.trim()).filter(Boolean); if(!lines.length) return;
    try{ state.week = await api('/weeks/'+state.week.id+'/tasks','POST',{tasks:lines.map(text=>({subject_id:subjectId, day, text, kind:/^bring\b/i.test(text)?'bring':'task'}))}); render(); toast(lines.length>1?`Added ${lines.length}`:'Added'); }catch(e){ toast(e.message); }
  }
  function addSubject(){ const name=prompt('Subject name (e.g. "Latin"):'); if(!name) return; const sub=prompt('Strand or note under it (optional, e.g. "Grammar"):')||''; saveWeekMeta({subjects:[...state.week.subjects,{id:uid(),name:name.trim(),sub:sub.trim()}]},'Subject added'); }
  function renameSubject(s){ const name=prompt('Subject name:',s.name); if(!name) return; const sub=prompt('Strand (optional):',s.sub||''); saveWeekMeta({subjects:state.week.subjects.map(x=>x.id===s.id?{...x,name:name.trim(),sub:(sub||'').trim()}:x)}); }
  function removeSubject(s){ const n=state.week.tasks.filter(t=>t.subject_id===s.id).length; if(!confirm(`Remove "${s.name}" from this week?${n?` Its ${n} assignment(s) will move under "Other".`:''}`)) return; saveWeekMeta({subjects:state.week.subjects.filter(x=>x.id!==s.id)},'Removed'); }
  function renameDays(){ const v=prompt('Day names, separated by commas:', state.week.days.join(', ')); if(!v) return; const days=v.split(',').map(x=>x.trim()).filter(Boolean); if(!days.length) return; if(days.length<state.week.days.length && !confirm('Fewer days than before — assignments on removed days will be deleted. Continue?')) return; saveWeekMeta({days},'Days updated'); }
  async function deleteWeek(){ if(!confirm(`Delete ${state.week.title} for ${state.student.name}? This can't be undone.`)) return; try{ await api('/weeks/'+state.week.id,'DELETE'); state.editMode=false; await loadWeeks(null); render(); toast('Week deleted'); }catch(e){ toast(e.message); } }
  async function newWeek(){
    const nextNum = state.weeks.length ? Math.max(...state.weeks.map(w=>w.num))+1 : 1;
    const numStr=prompt('Week number:', String(nextNum)); if(!numStr) return; const num=parseInt(numStr,10)||nextNum;
    let copy_from=null, copy_tasks=false;
    if(state.week){ copy_from=state.week.id; copy_tasks=confirm(`Copy ${state.week.title}'s assignments into Week ${num} as a starting point (unchecked)?\nOK = copy them · Cancel = keep subjects and days only`); }
    try{ const w = await api('/students/'+state.student.id+'/weeks','POST',{num, copy_from, copy_tasks}); state.weeks = await api('/students/'+state.student.id+'/weeks'); await loadWeek(w.id); toast(`Week ${num} created`); }catch(e){ toast(e.message); }
  }

  // ---------- drawer ----------
  function curTask(){ return state.week && state.week.tasks.find(x=>x.id===state.editingId); }
  function openDrawer(id){
    state.editingId=id; const t=curTask(); if(!t) return;
    const parent=isParent();
    $('#dEdit').hidden=!parent; $('#dRead').hidden=parent; $('#dSave').hidden=!parent; $('#dDelete').hidden=!parent;
    $('#dRead').textContent=t.text;
    $('#dText').value=t.text; $('#dKind').value=t.kind||'task';
    const ss=$('#dSubj'); ss.innerHTML=''; state.week.subjects.forEach(s=>ss.append(el('option',{value:s.id,selected:s.id===t.subject_id},s.name)));
    const ds=$('#dDay'); ds.innerHTML=''; state.week.days.forEach((d,i)=>ds.append(el('option',{value:i,selected:i===t.day},d)));
    $('#dToggle').textContent = t.done?'Mark not done':'Mark done';
    $('#dStatus').textContent = t.done ? `Done by ${t.done_by||'?'} · ${fmt(t.done_at)}` : 'Not done yet';
    renderThread(); $('#dMsg').value='';
    $('#drawer').setAttribute('open','');
  }
  function renderThread(){ const t=curTask(); const th=$('#dThread'); th.innerHTML=''; if(!t) return;
    if(!t.comments.length) th.append(el('div',{class:'status'},'No notes yet.'));
    t.comments.forEach(c=>th.append(el('div',{class:'msg'+(c.user_id===state.user.id?' mine':'')}, el('div',{class:'who'}, el('b',{},c.author), el('span',{}, fmt(c.created_at), (isParent()||c.user_id===state.user.id)? el('button',{class:'btn quiet sm',style:'margin-left:6px',onclick:()=>delComment(c)},'✕'):null)), el('div',{class:'body'},c.body)))); }
  function closeDrawer(){ $('#drawer').removeAttribute('open'); state.editingId=null; refresh(); }
  $('#dClose').onclick=closeDrawer; $('#drawer').addEventListener('click',e=>{ if(e.target===$('#drawer')) closeDrawer(); });
  $('#fam').addEventListener('click',e=>{ if(e.target===$('#fam')) closeFamily(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); closeFamily(); } });
  $('#dSave').onclick=async()=>{ const t=curTask(); if(!t) return; try{ await api('/tasks/'+t.id,'PUT',{text:$('#dText').value, subject_id:$('#dSubj').value, day:Number($('#dDay').value), kind:$('#dKind').value}); closeDrawer(); await loadWeek(state.week.id); toast('Saved'); }catch(e){ toast(e.message); } };
  $('#dToggle').onclick=()=>{ const t=curTask(); if(!t) return; toggleDone(t,!t.done); closeDrawer(); };
  $('#dDelete').onclick=async()=>{ const t=curTask(); if(!t||!confirm('Delete this assignment?')) return; try{ await api('/tasks/'+t.id,'DELETE'); closeDrawer(); await loadWeek(state.week.id); toast('Deleted'); }catch(e){ toast(e.message); } };
  $('#dSend').onclick=async()=>{ const t=curTask(); const body=$('#dMsg').value.trim(); if(!t||!body) return; try{ const c=await api('/tasks/'+t.id+'/comments','POST',{body}); t.comments.push(c); $('#dMsg').value=''; renderThread(); render(); }catch(e){ toast(e.message); } };
  $('#dMsg').addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter') $('#dSend').click(); });
  async function delComment(c){ const t=curTask(); try{ await api('/comments/'+c.id,'DELETE'); t.comments=t.comments.filter(x=>x.id!==c.id); renderThread(); render(); }catch(e){ toast(e.message); } }

  // ---------- family settings ----------
  let famUsers=[];
  async function openFamily(tab){ $('#fam').setAttribute('open',''); famTab(tab); await renderFamily(); }
  function closeFamily(){ $('#fam').removeAttribute('open'); }
  $('#fClose').onclick=closeFamily; $('#fTabKids').onclick=()=>famTab('kids'); $('#fTabLogins').onclick=()=>famTab('logins');
  function famTab(t){ $('#fKids').hidden=t!=='kids'; $('#fLogins').hidden=t!=='logins'; $('#fTabKids').setAttribute('aria-selected',String(t==='kids')); $('#fTabLogins').setAttribute('aria-selected',String(t==='logins')); }
  async function renderFamily(){
    try{ const me=await api('/me'); state.students=me.students; state.users=me.users; famUsers=await api('/users'); }catch(e){ toast(e.message); return; }
    const kr=$('#fKidRows'); kr.innerHTML='';
    state.students.forEach(s=>kr.append(el('tr',{}, el('td',{}, el('b',{},s.name)), el('td',{},s.grade||''), el('td',{}, el('span',{class:'dot',style:{display:'inline-block',width:'14px',height:'14px',borderRadius:'50%',background:s.color}})),
      el('td',{style:'text-align:right;white-space:nowrap'}, el('button',{class:'btn quiet sm',onclick:async()=>{ const name=prompt('Name:',s.name); if(!name) return; const grade=prompt('Grade / program:',s.grade||''); try{ await api('/students/'+s.id,'PUT',{name,grade:grade||''}); await renderFamily(); await refreshStudents(); }catch(e){ toast(e.message); } }},'edit'),
        el('button',{class:'btn quiet sm',onclick:async()=>{ if(!confirm(`Hide ${s.name}? Their weeks are kept but the page won't show.`)) return; try{ await api('/students/'+s.id,'PUT',{active:false}); await renderFamily(); await refreshStudents(); }catch(e){ toast(e.message); } }},'hide')))));
    const ur=$('#fUserRows'); ur.innerHTML='';
    famUsers.forEach(u=>{ const kid=state.students.find(s=>s.id===u.student_id);
      ur.append(el('tr',{style:u.active?'':'opacity:.5'}, el('td',{}, el('b',{},u.name), u.id===state.user.id?' (you)':''), el('td',{},u.role==='parent'?'Parent':'Child'), el('td',{},kid?kid.name:''),
        el('td',{style:'text-align:right;white-space:nowrap'}, el('button',{class:'btn quiet sm',onclick:async()=>{ const pin=prompt(`New PIN for ${u.name} (4+ characters):`); if(!pin) return; try{ await api('/users/'+u.id,'PUT',{pin}); toast('PIN changed'); }catch(e){ toast(e.message); } }},'change PIN'),
          u.id!==state.user.id? el('button',{class:'btn quiet sm',onclick:async()=>{ try{ await api('/users/'+u.id,'PUT',{active:!u.active}); await renderFamily(); }catch(e){ toast(e.message); } }}, u.active?'disable':'enable'):null))); });
    const us=$('#fUserStudent'); us.innerHTML=''; us.append(el('option',{value:''},'— which child —')); state.students.forEach(s=>us.append(el('option',{value:s.id},s.name)));
    us.hidden = $('#fUserRole').value!=='student';
  }
  async function refreshStudents(){ const me=await api('/me'); state.students=me.students; if(!state.student || !state.students.some(s=>s.id===state.student.id)) await pickStudent(null); else state.student=state.students.find(s=>s.id===state.student.id); render(); }
  $('#fUserRole').onchange=()=>{ $('#fUserStudent').hidden=$('#fUserRole').value!=='student'; };
  $('#fKidForm').onsubmit=async e=>{ e.preventDefault(); try{ await api('/students','POST',{name:$('#fKidName').value, grade:$('#fKidGrade').value, color:$('#fKidColor').value}); $('#fKidName').value=''; $('#fKidGrade').value=''; await renderFamily(); await refreshStudents(); toast('Child added'); }catch(x){ toast(x.message); } };
  $('#fUserForm').onsubmit=async e=>{ e.preventDefault(); try{ await api('/users','POST',{name:$('#fUserName').value, role:$('#fUserRole').value, student_id:$('#fUserStudent').value||null, pin:$('#fUserPin').value}); $('#fUserName').value=''; $('#fUserPin').value=''; await renderFamily(); toast('Login added'); }catch(x){ toast(x.message); } };

  boot();
})();
</script>
</body>
</html>
